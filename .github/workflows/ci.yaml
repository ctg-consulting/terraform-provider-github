name: CI
on:
  push:
    branches: [ctg]
  pull_request:
    branches: [ctg]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.6'
          cache: true
      - run: go test ./... -skip '^TestAcc'
      - run: go build ./...
